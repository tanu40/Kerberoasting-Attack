<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CTF: Kerberoasting Attack Detection | Active Directory Security</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Fira Code', system-ui, monospace; }
    body {
      background: linear-gradient(160deg, #0a0010 0%, #150030 50%, #0a0010 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; margin: 0;
    }
    .container {
      max-width: 1200px; width: 100%; background: rgba(15, 5, 30, 0.95);
      backdrop-filter: blur(28px); border: 1px solid rgba(200, 100, 50, 0.4);
      box-shadow: 0 25px 50px rgba(200, 80, 0, 0.25); border-radius: 2.5rem;
      padding: 2rem; color: #d8c8e8;
    }
    h1 { font-size: 2.2rem; font-weight: 700; text-align: center; background: linear-gradient(135deg, #ff8844, #cc4400); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.4rem; letter-spacing: 1px; }
    .subtitle { text-align: center; color: #c0a090; margin-bottom: 1.8rem; border-bottom: 1px dashed #503a30; padding-bottom: 1rem; font-style: italic; }
    .panel { background: rgba(10, 5, 20, 0.9); backdrop-filter: blur(12px); border-radius: 1.8rem; padding: 1.7rem; border: 1px solid #503a30; margin-bottom: 1.8rem; }
    .hidden { display: none !important; }
    input, button { background: #1a0a20; border: 1px solid #6a4080; border-radius: 2rem; padding: 0.7rem 1.3rem; color: #e0d0f0; font-weight: 500; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #ff8844; box-shadow: 0 0 14px #cc4400; }
    button { background: #2a1020; border-color: #cc6633; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 0.3rem; }
    button:hover { background: #3a1828; border-color: #ffaa66; box-shadow: 0 0 18px #cc6600; }
    .task-card { background: #0d0518; border-left: 6px solid #ff8844; padding: 1.2rem; border-radius: 1.3rem; margin: 1.2rem 0; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .log-line { background: #0a0315; border: 1px solid #2a1540; padding: 0.5rem 1rem; border-radius: 0.6rem; margin: 0.4rem 0; font-family: 'Fira Code', monospace; font-size: 0.78rem; white-space: pre-wrap; color: #c0a8e0; }
    .badge { background: #2a1540; padding: 0.2rem 0.9rem; border-radius: 20px; font-size: 0.8rem; }
    .ticket-viewer { background: #000008; border: 2px solid #ff6600; border-radius: 1rem; padding: 1rem; margin: 1rem 0; font-family: 'Fira Code', monospace; font-size: 0.75rem; color: #ffaa66; max-height: 400px; overflow-y: auto; box-shadow: 0 0 25px rgba(255,102,0,0.2); }
    .ticket-viewer-header { background: #1a0a00; padding: 0.5rem 1rem; margin: -1rem -1rem 0.8rem -1rem; border-bottom: 2px solid #ff6600; color: #ff8844; font-weight: bold; display: flex; justify-content: space-between; border-radius: 1rem 1rem 0 0; }
    .ticket-row { display: grid; grid-template-columns: 80px 120px 140px 100px 1fr; gap: 4px; padding: 3px 8px; border-bottom: 1px solid #1a0a20; font-size: 0.7rem; }
    .ticket-row.kerberoast { background: #1a0505; border-left: 3px solid #ff4444; }
    .ticket-row:hover { background: #0a0510; }
    .enc-badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 0.8rem; font-size: 0.65rem; }
    .enc-rc4 { background: #3a1010; border: 1px solid #ff4444; color: #ff6666; }
    .enc-aes { background: #103a10; border: 1px solid #44dd44; color: #66ff66; }
    .attack-flow { background: #0a0315; border: 2px solid #ff8844; border-radius: 1rem; padding: 1.5rem; margin: 1rem 0; position: relative; min-height: 180px; }
    .flow-node { position: absolute; padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.7rem; font-weight: bold; }
    .flow-attacker { background: #3a1010; border: 2px solid #ff4444; color: #ff8888; animation: pulseRed 1.5s infinite; }
    @keyframes pulseRed { 0%,100%{box-shadow:0 0 5px #ff4444} 50%{box-shadow:0 0 25px #ff0000} }
    .flow-dc { background: #1a1a40; border: 2px solid #4488cc; color: #88bbff; }
    .flow-arrow { position: absolute; height: 2px; background: #ff4444; transform-origin: left center; }
    .flag-box { background: #1a0020; border: 2px dashed #ffd700; padding: 0.9rem; border-radius: 20px; text-align: center; font-weight: bold; font-size: 1.4rem; letter-spacing: 3px; color: #ffd700; animation: glowGold 1.7s infinite; }
    @keyframes glowGold { 0%{box-shadow:0 0 5px #ffd700} 50%{box-shadow:0 0 30px #ffaa00} 100%{box-shadow:0 0 5px #ffd700} }
    .success-msg { color: #9effb7; font-weight: bold; }
    .toast { position: fixed; top: 20px; right: 20px; background: #1a0a20; border: 1px solid #ff8844; padding: 1rem 1.5rem; border-radius: 2rem; color: #e0d0f0; font-weight: bold; z-index: 9999; animation: slideIn 0.3s ease, fadeOut 0.3s 2.5s forwards; }
    @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes fadeOut { to{opacity:0;transform:translateY(-10px)} }
    code { background: #1a0a20; padding: 0.2rem 0.6rem; border-radius: 12px; font-family: 'Fira Code', monospace; }
  </style>
</head>
<body>
<div class="container" id="appContainer">

  <div id="loginSection">
    <h1>🎫 KERBEROAST HUNTER</h1>
    <div class="subtitle">Kerberoasting Attack Detection · TGS Request Analysis</div>
    <div class="panel">
      <div style="text-align:center;">
        <input type="text" id="studentNameInput" placeholder="Enter your name" autocomplete="off" style="width:70%;">
        <input type="password" id="studentPassInput" placeholder="Enter password" style="width:70%; margin-top:0.7rem;">
        <button id="studentSubmitLogin" style="margin-top:0.8rem;">🔐 Enter CTF Lab</button>
        <p style="font-size:0.8rem; color:#c0a090; margin-top:0.5rem;">
          Password: <code>45_2026</code>
        </p>
      </div>
    </div>
  </div>

  <div id="studentDashboard" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:#ff8844;">👤 <span id="displayStudentName"></span></h2>
      <button id="logoutStudentBtn">🚪 Logout</button>
    </div>
    <div id="taskContainer"></div>
  </div>

</div>

<script>
(function() {
    const FIXED_PASSWORD = '45_2026';
    const STORAGE_KEY = 'kerberoast_ctf_progress';
    
    let currentUser = null;
    let completedTasks = [];

    function loadProgress() {
        try { const s=localStorage.getItem(STORAGE_KEY); if(s){const d=JSON.parse(s); completedTasks=d.completed||[]; return d.name; } } catch(e) {}
        return null;
    }
    function saveProgress() { if(currentUser) localStorage.setItem(STORAGE_KEY, JSON.stringify({name:currentUser.name, completed:currentUser.completedTasks})); }

    const tasks = [
      { id: 1, title: "🎯 Task 1: Identify the Attack", desc: "What attack technique is being used? (single word)", answer: "kerberoasting", extra: "attack" },
      { id: 2, title: "📋 Task 2: Identify Log Event", desc: "Which Event ID with which encryption type? (format: ID,EncType)", answer: "4769,rc4", extra: "event" },
      { id: 3, title: "👤 Task 3: Find Malicious User", desc: "Which user account is requesting all the TGS tickets?", answer: "jsmith", extra: "user" },
      { id: 4, title: "🔓 Task 4: Offline Cracking", desc: "What tool cracks Kerberos TGS hashes? (tool name)", answer: "hashcat", extra: "crack" },
      { id: 5, title: "🛡️ Task 5: Remediation", desc: "What replaces regular service accounts? (abbreviation)", answer: "gmsa", extra: "remediate" }
    ];

    const tgsRequests = [
      { time: "08:15:01", user: "jsmith", service: "MSSQLSvc/sql01.corp.local", enc: "RC4", class: "kerberoast" },
      { time: "08:15:02", user: "jsmith", service: "HTTP/spweb01.corp.local", enc: "RC4", class: "kerberoast" },
      { time: "08:15:03", user: "jsmith", service: "TERMSRV/ts01.corp.local", enc: "RC4", class: "kerberoast" },
      { time: "08:15:04", user: "jsmith", service: "MSSQLSvc/sql02.corp.local", enc: "RC4", class: "kerberoast" },
      { time: "08:15:05", user: "jsmith", service: "CIFS/file01.corp.local", enc: "RC4", class: "kerberoast" },
      { time: "08:15:06", user: "jsmith", service: "HTTP/intranet.corp.local", enc: "RC4", class: "kerberoast" },
      { time: "08:30:00", user: "asmith", service: "CIFS/file01.corp.local", enc: "AES256", class: "" },
      { time: "09:00:00", user: "jdoe", service: "HTTP/spweb01.corp.local", enc: "AES128", class: "" }
    ];

    function showToast(m, e) {
      const x=document.querySelector('.toast'); if(x)x.remove();
      const t=document.createElement('div'); t.className='toast';
      t.style.background=e?'#3a1a1a':'#1a0a20'; t.style.borderColor=e?'#aa3030':'#ff8844';
      t.style.color=e?'#ffaaaa':'#e0d0f0'; t.textContent=m;
      document.body.appendChild(t); setTimeout(()=>{if(t.parentNode)t.remove();},3000);
    }

    function createAttackFlow() {
      let h='<p style="color:#ff8844;">⚔️ Kerberoasting Attack Flow:</p>';
      h+='<div class="attack-flow" style="position:relative;min-height:180px;">';
      h+='<div class="flow-node flow-attacker" style="left:5%;top:25%;">Attacker<br>jsmith</div>';
      h+='<div class="flow-node flow-dc" style="left:70%;top:25%;">Domain<br>Controller</div>';
      h+='<div style="position:absolute;left:25%;top:18%;color:#ffaa66;font-size:0.65rem;">❶ TGS-REQ (multiple SPNs)</div>';
      h+='<div style="position:absolute;left:60%;top:55%;color:#ffcc44;font-size:0.65rem;">❷ TGS-REP (RC4 encrypted)</div>';
      h+='<div style="position:absolute;left:25%;top:68%;color:#ff6666;font-size:0.65rem;">❸ Extract hash → Crack offline</div>';
      h+='<div class="flow-arrow" style="left:22%;top:32%;width:50%;"></div>';
      h+='<div class="flow-arrow" style="left:72%;top:32%;width:48%;transform:rotate(180deg);"></div>';
      h+='</div>';
      return h;
    }

    function createTicketViewer() {
      let h='<p style="color:#ff8844;">🎫 Kerberos TGS Request Log (Event 4769):</p>';
      h+='<div class="ticket-viewer">';
      h+='<div class="ticket-viewer-header"><span>🔑 TGS Requests</span><span>⚠️ RC4 = Crackable</span></div>';
      h+='<div class="ticket-row" style="font-weight:bold;border-bottom:2px solid #ff6600;">';
      h+='<span>Time</span><span>User</span><span>Service (SPN)</span><span>Encryption</span><span>Risk</span></div>';
      tgsRequests.forEach(t=>{
        h+=`<div class="ticket-row ${t.class}">`;
        h+=`<span>${t.time}</span><span style="color:${t.user==='jsmith'?'#ff6666':'#c0a8e0'};">${t.user}</span>`;
        h+=`<span>${t.service}</span><span><span class="enc-badge ${t.enc.startsWith('RC4')?'enc-rc4':'enc-aes'}">${t.enc}</span></span>`;
        h+=`<span style="color:${t.class?'#ff4444':'#44dd44'};">${t.class?'⚠️ KERBEROASTING':'✅ Normal'}</span></div>`;
      });
      h+='</div>';
      return h;
    }

    function renderTasks() {
      if(!currentUser) return;
      document.getElementById('displayStudentName').innerText=currentUser.name;
      const c=document.getElementById('taskContainer'), done=currentUser.completedTasks||[];
      let h='<h3>🎫 Kerberoasting Investigation Dashboard</h3>';
      h+=createAttackFlow();
      h+=createTicketViewer();
      h+='<p style="font-size:0.7rem;color:#c0a090;">🔴 jsmith requested 6 TGS tickets in 5 seconds with RC4 encryption</p>';
      tasks.forEach(t=>{
        const dn=done.includes(t.id);
        h+=`<div class="task-card" style="border-left-color:${dn?'#2ecc71':'#ff8844'};"><strong>${t.title}</strong> <span class="badge">${dn?'✅ Done':'🔒 Pending'}</span><p>${t.desc}</p>`;
        if(t.extra==='crack'){
          h+='<div class="log-line">🔓 hashcat -m 13100 tgs_hashes.txt rockyou.txt --force</div>';
          h+='<div class="log-line">📊 TGS-REP contains service account NTLM hash encrypted with RC4</div>';
        } else if(t.extra==='remediate'){
          h+='<div class="log-line">🛡️ Group Managed Service Accounts (gMSA) auto-rotate passwords</div>';
          h+='<div class="log-line">🔒 Set long complex passwords (25+ chars) for service accounts</div>';
        }
        if(!dn) h+=`<div style="display:flex;gap:0.5rem;margin-top:0.5rem;"><input type="text" id="ai${t.id}" placeholder="Your answer" style="flex:1;"><button onclick="window.submitT(${t.id})">✅ Submit</button></div>`;
        else h+='<p class="success-msg">✔ Completed</p>';
        h+='</div>';
      });
      if(done.length===tasks.length) h+='<div class="flag-box">🏆 FLAG{KERBEROASTING} 🏆</div>';
      c.innerHTML=h;
    }

    window.submitT = id => {
      if(!currentUser) return;
      const inp=document.getElementById('ai'+id); if(!inp) return;
      const a=inp.value.trim(), t=tasks.find(x=>x.id===id); if(!t) return;
      let ok=false;
      if(id===2){const l=a.toLowerCase(); ok=l.includes('4769')&&l.includes('rc4');}
      else if(id===5){const l=a.toLowerCase(); ok=l==='gmsa';}
      else ok=a.toLowerCase()===t.answer.toLowerCase();
      if(ok){if(!currentUser.completedTasks.includes(id)){currentUser.completedTasks.push(id);saveProgress();}showToast('✅ Correct!');renderTasks();}
      else{showToast('❌ Incorrect.',true);inp.style.animation='shake 0.5s ease';setTimeout(()=>inp.style.animation='',500);}
    };

    function showLogin(){document.getElementById('loginSection').classList.remove('hidden');document.getElementById('studentDashboard').classList.add('hidden');currentUser=null;}
    function showDash(){document.getElementById('loginSection').classList.add('hidden');document.getElementById('studentDashboard').classList.remove('hidden');renderTasks();}

    document.addEventListener('DOMContentLoaded',()=>{
      const sn=loadProgress(); if(sn) document.getElementById('studentNameInput').value=sn;
      document.getElementById('studentSubmitLogin').addEventListener('click',()=>{
        const n=document.getElementById('studentNameInput').value.trim();
        const p=document.getElementById('studentPassInput').value.trim();
        if(!n||!p){showToast('Enter name and password.',true);return;}
        if(p!==FIXED_PASSWORD){showToast('Invalid password. Use: 45_2026',true);return;}
        currentUser={name:n,completedTasks:[...completedTasks]};
        document.getElementById('studentPassInput').value=''; showDash();
      });
      document.getElementById('logoutStudentBtn').addEventListener('click',()=>{showToast('Logged out.');showLogin();});
      const s=document.createElement('style');s.textContent='@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}';
      document.head.appendChild(s); showLogin();
    });
})();
</script>
</body>
</html>
